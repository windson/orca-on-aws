name: Check workstation reference
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests
      - name: Render each deployable agent
        run: |
          for agent in codex-bedrock opencode-bedrock kiro-cli; do
            python3 tools/render.py --agent "$agent" > "$RUNNER_TEMP/$agent.json"
          done
      - run: git ls-files '*.sh' platform/orca/session | xargs shellcheck
